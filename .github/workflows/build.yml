name: "Main / Pull requests build"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.txt'
      - 'LICENSE'
      - 'docs/**'
    branches: [ main ]
  push:
    branches:
      - main

jobs:
  pre-commit:
    name: Pre-commit check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Setup Java
        uses: ./.github/actions/java-setup
        with:
          cache: ""
      - name: Pre-commit checks
        uses: pre-commit/action@v3.0.1
      - name: pre-commit-c-lite
        uses: pre-commit-ci/lite-action@v1.1.0
        if: always()

  build:
    runs-on: ${{ matrix.os }}
    needs: [ pre-commit ]
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-15-intel ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: ./.github/actions/java-setup
        with:
          cache: 'maven'

      - name: Build with Maven
        run: mvn --no-transfer-progress verify

      - name: Cache SonarQube packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        if: matrix.os == 'ubuntu-latest'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kolivam1-commits
            -Dsonar.projectKey=kolivam1-commits_WebGoat
